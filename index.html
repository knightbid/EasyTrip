            let hash = 0;

                hash = seed.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash) % 360;
        };

        const getRandomImage = (width, height, seed) => {
            const hue = seedToHue(seed);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
                <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="hsl(${hue},55%,65%)"/>
                    <stop offset="100%" stop-color="hsl(${(hue + 40) % 360},55%,45%)"/>
                </linearGradient></defs>
                <rect width="100%" height="100%" fill="url(#g)"/>
                <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="white" font-size="28" font-family="Arial,sans-serif" font-weight="bold">${seed}</text>
            </svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        };

        const FALLBACK_IMAGE = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(

        )}`;

        const encodeData = (data) => {
            try {
                // Encode URI component to handle Unicode (Vietnamese), then convert to Base64
                return btoa(encodeURIComponent(JSON.stringify(data)).replace(/%([0-9A-F]{2})/g,
                    (match, p1) => String.fromCharCode(parseInt(p1, 16))));
            } catch (e) { console.error(e); return ""; }
        };

        const decodeData = (str) => {
            try {
                // Decode Base64 then URI component to get back Unicode string
                return JSON.parse(decodeURIComponent(atob(str).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);

        // Nén ảnh trước khi lưu để tránh vượt giới hạn 1 MiB/document của Firestore
        const compressImage = (file, maxDim = 1280, quality = 0.7) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = reject;
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = reject;
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxDim || h > maxDim) {
                            const scale = maxDim / Math.max(w, h);
                            w = Math.round(w * scale);
                            h = Math.round(h * scale);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        };

        const onlyDigits = (s) => String(s == null ? '' : s).replace(/[^0-9]/g, '');

        const parseAmount = (v) => {
            if (typeof v === 'number') return Math.round(v);
            if (v == null) return 0;
            let s = String(v).toLowerCase().replace(/[₫\s]/g, '').replace(/vnd|vnđ/g, '');
            if (!s) return 0;
            let mul = 1;
            if (/(triệu|tr)$/.test(s)) { mul = 1000000; s = s.replace(/(triệu|tr)$/, ''); }
            else if (/(nghìn|ngàn|k)$/.test(s)) { mul = 1000; s = s.replace(/(nghìn|ngàn|k)$/, ''); }
            else if (/m$/.test(s)) { mul = 1000000; s = s.replace(/m$/, ''); }
            s = s.replace(/,/g, '.');
            if (mul === 1) {
                const n = parseInt(s.replace(/\./g, ''), 10);
                return isNaN(n) ? 0 : n;
            }
            const n = parseFloat(s);
            return isNaN(n) ? 0 : Math.round(n * mul);
        };

            if (v === '' || v == null) return '';

        // --- FIREBASE OPERATIONS ---

        const initFirebaseListener = () => {
            const loader = document.getElementById('global-loader');

            // Show the page immediately while Firebase loads in background
            checkShareLink();
            render();
            if (loader) loader.classList.add('hidden-loader');

            // Overall timeout: if Firebase hasn't responded in 5s, re-render anyway
            let firebaseResolved = false;
            const safetyTimeout = setTimeout(() => {
                if (!firebaseResolved) {
                    checkShareLink();
                    render();
                }
            }, 5000);

            const finish = () => {
                firebaseResolved = true;
                clearTimeout(safetyTimeout);
            };

            // Dynamic import Firebase modules when initializing listener and run Firestore logic after ready
            const ensureFirebase = async () => {
                if (typeof initializeApp === 'undefined' || !initializeApp) {
                    try {
                        const fbApp = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js');
                        const fbFire = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');
                        const fbAuth = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js');
                        initializeApp = fbApp.initializeApp;
                        // Use getFirestore for browser SDK
                        getFirestore = fbFire.getFirestore || fbFire.initializeFirestore;
                        collection = fbFire.collection;
                        onSnapshot = fbFire.onSnapshot;
                        addDoc = fbFire.addDoc;
                        doc = fbFire.doc;
                        updateDoc = fbFire.updateDoc;
                        deleteDoc = fbFire.deleteDoc;
                        serverTimestamp = fbFire.serverTimestamp;
                        getAuth = fbAuth.getAuth;
                        signInAnonymously = fbAuth.signInAnonymously;
                    } catch (err) {
                        console.warn('Firebase dynamic import failed:', err);
                        // Leave db undefined and fallback to offline UI
                    }
                }

                // If imports succeeded but app/db not initialized yet, initialize here
                try {
                    if (!firebaseApp && typeof initializeApp === 'function') {
                        firebaseApp = initializeApp(firebaseConfig);
                    }
                    if (!db && firebaseApp && typeof getFirestore === 'function') {
                        db = getFirestore(firebaseApp);
                        console.log('Firebase initialized inside ensureFirebase');
                    }
                    if (db && typeof getAuth === 'function' && typeof signInAnonymously === 'function') {
                        try {
                            await signInAnonymously(getAuth(firebaseApp));
                        } catch (authErr) {
                            console.warn('Anonymous sign-in failed (bật Anonymous provider trong Firebase Console):', authErr);
                        }
                    }
                } catch (err) {
                    console.warn('Failed to initialize Firebase in ensureFirebase:', err);
                }
            };

            (async () => {
                await ensureFirebase();
                if (!db) {
                    finish();
                    return;
                }

                const q = collection(db, TRIPS_COLLECTION);

                onSnapshot(q, (snapshot) => {
                    finish();
                    const tripsData = [];
                    snapshot.forEach((doc) => {
                        tripsData.push({ id: doc.id, ...doc.data() });
                    });

                    store.trips = tripsData.sort((a, b) => {
                        const timeA = a.createdAt?.seconds || 0;
                        const timeB = b.createdAt?.seconds || 0;
                        return timeB - timeA;
                    });

                    checkShareLink();
                    render();
                }, (error) => {
                    finish();
                    console.error("Firebase Error:", error);
                    checkShareLink();
                    render();
                });
            })();
        };

                    <div id="create-trip-form" class="${store.isCreating ? 'block' : 'hidden'} mb-8 bg-white p-6 rounded-lg shadow-md border border-indigo-100 animate-fade-in-down">
                        <form data-action="submit-create-trip" class="space-y-4">
                            <div class="flex flex-col sm:flex-row gap-4">
                                <input type="text" id="new-trip-input" value="${escapeHtml(store.newTripName)}" placeholder="Tên chuyến đi (VD: Đà Lạt 2024)" class="flex-1 rounded-md border border-gray-300 p-2 focus:ring-indigo-500 shadow-sm" />
                            </div>
                            <p id="new-trip-error" class="hidden text-sm text-red-600 font-medium"></p>
                            
                            <div class="space-y-2">

                                         <img id="preview-new-cover" src="${store.selectedImage || 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"150\" height=\"80\"><rect width=\"100%\" height=\"100%\" fill=\"#f1f5f9\"/><text x=\"50%\" y=\"50%\" dominant-baseline=\"central\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"14\" font-family=\"Arial,sans-serif\">Auto</text></svg>')}" class="w-full h-full object-cover" onerror="this.src=FALLBACK_IMAGE" />

                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${tripsHtml}</div>
                </div>
            `;
        };

        const renderTripDetail = () => {
            const trip = store.trips.find(t => t.id === store.activeTripId);
if (!trip) {
return `         <div class="p-8 text-center">             <div class="text-6xl mb-4">🦖</div>                     <div class="text-sm text-gray-500 mt-2">
                Khủng long đang chạy.             </div>         </div>
    `;
}

            const expenses = trip.expenses || [];
            const advances = trip.advances || [];
            const members = trip.members || [];
            const totalSpent = expenses.reduce((sum, e) => sum + e.amount, 0);

            // Calculate Stats
            const getMemberWeight = (mem) => mem.childRate || 1;

            const memberStats = members.map(m => {
                let paid = 0;
                let consumed = 0;
                let txCount = 0; // Transactions involved/paid
                expenses.forEach(e => {
                    if (e.payerId === m.id) { paid += e.amount; txCount++; }
                    const involved = (e.involvedMemberIds && e.involvedMemberIds.length > 0) ? e.involvedMemberIds : members.map(mem => mem.id);
                    if (involved.includes(m.id)) {
                        const totalWeight = involved.reduce((sum, mid) => {
                            const mem = members.find(member => member.id === mid);
                            return sum + getMemberWeight(mem);
                        }, 0);
                        consumed += e.amount * (getMemberWeight(m) / totalWeight);
                    }
                });
                    // Include advances: money the member put into the common pool (counts as paid)
                    const advForMember = advances.filter(a => a.memberId === m.id).reduce((s, a) => s + (a.amount || 0), 0);
                    paid += advForMember;
                return { ...m, paid, consumed, balance: paid - consumed, txCount };
            }).sort((a, b) => a.balance - b.balance);

            const expenseRowHtml = (e) => {
                const payerMember = members.find(m => m.id === e.payerId);
                const payer = payerMember?.name || 'Unknown';
                const count = e.involvedMemberIds?.length || members.length;
                const iconName = e.categoryIcon || 'receipt';
                return `
                    <div class="flex items-center justify-between p-4 hover:bg-gray-50 rounded-lg border border-gray-100 transition-colors group">
                        <div class="flex items-start gap-3 flex-1 min-w-0 ${!store.isReadOnly ? 'cursor-pointer' : ''}" data-action="${!store.isReadOnly ? 'edit-expense' : ''}" data-id="${e.id}">
                            <div class="bg-indigo-100 p-2 rounded-lg text-indigo-600 mt-1 flex-shrink-0"><i data-lucide="${iconName}" class="w-5 h-5"></i></div>
                            <div class="min-w-0">
                                <h4 class="font-semibold text-gray-900 break-words">${escapeHtml(e.description)}</h4>
                                <p class="text-sm text-gray-500"><span class="font-medium text-gray-700">${escapeHtml(payer)}</span> đã trả • <span class="text-gray-400 italic ml-1">${count === members.length ? 'Tất cả' : `Cho ${count} người`}</span></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 flex-shrink-0"><span class="font-bold text-gray-900 whitespace-nowrap">${formatCurrency(e.amount)}</span>${!store.isReadOnly ? `<button data-action="edit-expense" data-id="${e.id}" aria-label="Sửa khoản chi" class="text-gray-400 hover:text-indigo-500 p-2"><i data-lucide="edit-2" class="w-4 h-4"></i></button><button data-action="delete-expense" data-id="${e.id}" aria-label="Xóa khoản chi" class="text-gray-400 hover:text-red-500 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}</div>
                    </div>`;
            };

            const renderExpensesTab = () => {
                const search = (store.expenseSearchText || '').toLowerCase().trim();
                const filtered = expenses.filter(e => {
                    if (!search) return true;
                    const payer = (members.find(m => m.id === e.payerId)?.name || '').toLowerCase();
                    return (e.description || '').toLowerCase().includes(search) || payer.includes(search);
                });

                const groups = {};
                const order = [];
                filtered.forEach(e => {
                    const key = new Date(e.date).toLocaleDateString('vi-VN');
                    if (!groups[key]) { groups[key] = []; order.push(key); }
                    groups[key].push(e);
                });

                const list = expenses.length === 0
                    ? `<div class="text-center py-12 text-gray-400"><i data-lucide="receipt" class="w-12 h-12 mx-auto mb-2 opacity-20"></i><p>Chưa có khoản chi nào.</p></div>`
                    : filtered.length === 0
                        ? `<div class="text-center py-10 text-gray-400"><i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 opacity-30"></i><p>Không tìm thấy khoản chi phù hợp.</p></div>`
                        : order.map(key => `
                            <div class="mb-4">
                                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 px-1">${key}</div>
                                <div class="space-y-2">${groups[key].map(expenseRowHtml).join('')}</div>
                            </div>`).join('');

                const quickAdd = !store.isReadOnly && members.length > 0 ? `
                    <div class="mb-6">
                        <div class="relative">
                            <input type="text" id="quick-add-input" value="${escapeHtml(store.quickAddText)}" placeholder='Nhập nhanh: "Ăn tối 500k Hùng trả" ...' class="w-full pl-4 pr-24 py-3 rounded-full border border-gray-300 shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none" ${store.isAnalyzing ? 'disabled' : ''} />
                            <div class="absolute right-1 top-1 bottom-1 flex items-center gap-1">
                                <button data-action="ai-quick-add" title="Phân tích bằng AI" aria-label="Phân tích bằng AI" class="rounded-full h-full px-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white disabled:opacity-50">${store.isAnalyzing ? '<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i>' : '<i data-lucide="sparkles" class="w-4 h-4"></i>'}</button>
                                <button data-action="open-expense-modal" title="Thêm khoản chi" aria-label="Thêm khoản chi" class="rounded-full h-full w-10 bg-gray-100 hover:bg-gray-200"><i data-lucide="plus" class="w-5 h-5 mx-auto"></i></button>
                            </div>
                        </div>
                        <div class="flex justify-end mt-1.5">
                            <button data-action="advance-prompt" class="text-xs font-medium text-amber-600 hover:text-amber-700 flex items-center gap-1"><i data-lucide="wallet" class="w-3.5 h-3.5"></i> Ứng tiền trước</button>
                        </div>
                    </div>` : '';

                const searchBar = expenses.length > 0 ? `
                    <div class="relative mb-4">
                        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                        <input type="text" id="expense-search" value="${escapeHtml(store.expenseSearchText || '')}" placeholder="Tìm khoản chi hoặc người trả..." class="w-full pl-9 pr-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                    </div>` : '';

                return `<div>${quickAdd}${searchBar}<div class="space-y-4">${list}</div></div>`;
            };

            const renderBalancesTab = () => {
                if (members.length === 0) return `<div class="text-center py-12 text-gray-400"><i data-lucide="users" class="w-12 h-12 mx-auto mb-2 opacity-20"></i><p>Chưa có thành viên nào.</p><p class="text-sm mt-1">Thêm thành viên ở tab "Thành Viên" để bắt đầu chia tiền.</p></div>`;
                const debtors = memberStats.filter(m => m.balance < -100).sort((a, b) => a.balance - b.balance);
                const creditors = memberStats.filter(m => m.balance > 100).sort((a, b) => b.balance - a.balance);
                const suggestions = [];
                let i = 0; let j = 0;
                const dList = debtors.map(d => ({ ...d }));
                const cList = creditors.map(c => ({ ...c }));

                while (i < dList.length && j < cList.length) {
                    const debtor = dList[i];
                    const creditor = cList[j];
                    const amount = Math.min(Math.abs(debtor.balance), creditor.balance);

                    if (amount > 0) {
                        suggestions.push({ from: debtor.name, to: creditor.name, amount });
                    }

                    debtor.balance += amount;
                    creditor.balance -= amount;

                    if (Math.abs(debtor.balance) < 100) i++;
                    if (creditor.balance < 100) j++;
                }

                return `
                <div class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        ${memberStats.map(m => `

                                <div class="w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-white ${m.balance >= 0 ? 'bg-green-500' : 'bg-red-500'}">
                                     <i data-lucide="${m.icon || 'user'}" class="w-3.5 h-3.5"></i>
                                </div>
                                <div class="min-w-0">
                                    <div class="font-semibold text-sm leading-tight truncate" title="${escapeHtml(m.name)}">${escapeHtml(m.name)}</div>
                                    <div class="text-[10px] leading-tight ${m.balance > 0 ? 'text-green-600' : m.balance < 0 ? 'text-red-600' : 'text-gray-400'}">${m.balance > 0 ? 'Được nhận lại' : m.balance < 0 ? 'Cần trả' : 'Đã cân bằng'}</div>
                                </div>
                            </div>
                            <div class="text-sm font-bold whitespace-nowrap flex-shrink-0 ${m.balance > 0 ? 'text-green-600' : m.balance < 0 ? 'text-red-600' : 'text-gray-400'}">${m.balance > 0 ? '+' : ''}${formatCurrency(m.balance)}</div>
                        </div>`).join('')}
                    </div>
                    
                    ${suggestions.length > 0 ? `
                    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                        <div class="px-3 py-2 bg-indigo-50 border-b border-indigo-100">
                             <h3 class="text-sm font-bold text-indigo-900 flex items-center gap-2"><i data-lucide="send" class="w-4 h-4"></i> Gợi Ý Chuyển Khoản</h3>
                        </div>
                        <div class="divide-y divide-gray-100">
                            ${suggestions.map(s => `
                            <div class="px-3 py-2.5 flex items-center justify-between gap-3 hover:bg-gray-50">
                                <div class="flex items-center gap-2 min-w-0 text-sm">
                                    <span class="font-bold text-red-600 truncate" title="${escapeHtml(s.from)}">${escapeHtml(s.from)}</span>
                                    <i data-lucide="arrow-right" class="w-4 h-4 text-gray-400 flex-shrink-0"></i>
                                    <span class="font-bold text-green-600 truncate" title="${escapeHtml(s.to)}">${escapeHtml(s.to)}</span>
                                </div>
                                <div class="font-bold text-gray-800 whitespace-nowrap flex-shrink-0">${formatCurrency(s.amount)}</div>
                            </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : trip.expenses.length > 0 ? `
                     <div class="p-8 text-center bg-green-50 rounded-xl border border-green-200 text-green-800">
                        <i data-lucide="check-circle" class="w-12 h-12 mx-auto mb-2 text-green-500"></i>
                        <p class="font-bold">Mọi thứ đã cân bằng!</p>
                        <p class="text-sm">Không ai nợ ai cả.</p>
                     </div>
                    ` : `
                     <div class="text-center py-12 text-gray-400">
                        <i data-lucide="receipt" class="w-12 h-12 mx-auto mb-2 opacity-20"></i>
                        <p>Chưa có khoản chi nào.</p>
                        <p class="text-sm mt-1">Thêm khoản chi để tính công nợ.</p>
                     </div>
                    `}
                </div>`;
            };

            const renderReportTab = () => {
                if (members.length === 0) return `<div class="text-center py-12 text-gray-400"><i data-lucide="bar-chart-3" class="w-12 h-12 mx-auto mb-2 opacity-20"></i><p>Chưa có dữ liệu để tổng kết.</p><p class="text-sm mt-1">Thêm thành viên và khoản chi để xem báo cáo.</p></div>`;
                const topSpender = [...memberStats].sort((a, b) => b.paid - a.paid)[0];
                const mostActive = [...memberStats].sort((a, b) => b.txCount - a.txCount)[0];
                const searchText = (store.reportSearchText || '').toLowerCase();
                const filteredExpenses = expenses.filter(e => e.description.toLowerCase().includes(searchText));

                const matrixHtml = `
                    <div class="mt-8 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <h3 class="font-bold text-gray-800 flex items-center gap-2"><i data-lucide="grid" class="w-4 h-4"></i> Ma trận sử dụng (Ai dùng gì?)</h3>
                          
                        </div>
                        <div class="overflow-x-auto max-h-[500px]">
                            <table class="w-full text-sm text-left border-collapse">
                                <thead class="text-xs text-gray-500 uppercase bg-gray-50 sticky-header shadow-sm">
                                    <tr>
                                        <th class="px-4 py-3 sticky-col-left bg-gray-50 shadow-right min-w-[150px]">Khoản chi</th>
                                        <th class="px-4 py-3 text-right whitespace-nowrap bg-gray-50">Tổng tiền</th>
                                        ${members.map(m => `<th class="px-4 py-3 text-center whitespace-nowrap min-w-[100px] bg-gray-50 border-l border-gray-200"><div class="flex flex-col items-center gap-1"><i data-lucide="${m.icon || 'user'}" class="w-4 h-4 text-gray-400"></i><span>${m.name}</span></div></th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    ${filteredExpenses.length === 0 ? `<tr><td colspan="${members.length + 2}" class="px-6 py-8 text-center text-gray-400 italic">Không tìm thấy khoản chi nào.</td></tr>` :
                        filteredExpenses.map(e => {
                            const involved = e.involvedMemberIds && e.involvedMemberIds.length > 0 ? e.involvedMemberIds : members.map(m => m.id);
                            const icon = e.categoryIcon || 'receipt';
                            return `
                                            <tr class="hover:bg-gray-50 transition-colors">
                                                <td class="px-4 py-3 font-medium text-gray-900 sticky-col-left bg-white shadow-right min-w-[160px] max-w-[260px] align-top" title="${e.description}">
                                                    <div class="flex items-start gap-2">
                                                        <i data-lucide="${icon}" class="w-3 h-3 mt-0.5 text-indigo-500 flex-shrink-0"></i>
                                                        <span class="break-words">${e.description}</span>
                                                    </div>
                                                    <div class="text-[10px] text-gray-400 font-normal mt-0.5 ml-5">${new Date(e.date).toLocaleDateString('vi-VN')}</div>
                                                </td>
                                                <td class="px-4 py-3 text-right text-indigo-600 font-medium whitespace-nowrap">${formatCurrency(e.amount)}</td>
                                                ${(() => {
                                const totalWeight = involved.reduce((sum, mid) => {
                                    const mem = members.find(member => member.id === mid);
                                    return sum + (mem.childRate || 1);
                                }, 0);
                                return members.map(m => {
                                    const isInvolved = involved.includes(m.id);
                                    const splitAmount = isInvolved ? e.amount * ((m.childRate || 1) / totalWeight) : 0;
                                    return `
                                                        <td class="px-4 py-3 text-center border-l border-gray-100">
                                                            ${isInvolved
                                        ? `<div class="flex flex-col items-center group/cell">
                                                                    <i data-lucide="check-circle-2" class="w-5 h-5 text-green-500 mb-1"></i>
                                                                    <span class="text-[10px] text-gray-400 font-medium group-hover/cell:text-gray-600">${formatCurrency(splitAmount)}</span>
                                                                   </div>`
                                        : '<span class="text-gray-200 text-lg">-</span>'}
                                                        </td>
                                                    `;
                                }).join('');
                            })()}
                                            </tr>
                                        `;
                        }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                return `
                    <div class="space-y-6 animate-fade-in-up">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="bg-blue-50 p-4 rounded-xl border border-blue-200"><p class="text-blue-600 text-xs font-bold uppercase">Tổng Chi Phí</p><p class="text-2xl font-bold text-blue-900 mt-1">${formatCurrency(totalSpent)}</p></div>
                            <div class="bg-purple-50 p-4 rounded-xl border border-purple-200"><p class="text-purple-600 text-xs font-bold uppercase">Bình Quân/Người</p><p class="text-2xl font-bold text-purple-900 mt-1">${formatCurrency(members.length ? totalSpent / members.length : 0)}</p></div>
                            <div class="bg-amber-50 p-4 rounded-xl border border-amber-200"><p class="text-amber-600 text-xs font-bold uppercase">Top Chi Tiền</p><p class="text-xl font-bold text-amber-900 mt-1 truncate">${topSpender && topSpender.paid > 0 ? topSpender.name : '---'}</p></div>
                            <div class="bg-green-50 p-4 rounded-xl border border-green-200"><p class="text-green-600 text-xs font-bold uppercase">Top Giao Dịch</p><p class="text-xl font-bold text-green-900 mt-1 truncate">${mostActive && mostActive.txCount > 0 ? mostActive.name : '---'}</p></div>
                        </div>

                        ${matrixHtml}

                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                            <div class="px-6 py-4 border-b border-gray-100 bg-gray-50"><h3 class="font-bold text-gray-800">Tổng kết công nợ</h3></div>

                                <tbody>${memberStats.map(m => `
                                    <tr class="bg-white border-b border-gray-100 hover:bg-gray-50">
                                        <td class="px-6 py-4 font-medium text-gray-900 flex items-center gap-2"><i data-lucide="${m.icon || 'user'}" class="w-4 h-4 text-gray-400"></i> ${m.name}</td>

                                        <td class="px-6 py-4 text-right text-pink-600">${formatCurrency(m.consumed)}</td>
                                        <td class="px-6 py-4 text-right font-bold ${m.balance >= 0 ? 'text-green-600' : 'text-red-600'}">${m.balance > 0 ? '+' : ''}${formatCurrency(m.balance)}</td>
                                    </tr>`).join('')}</tbody>
                            </table></div>
                        </div>
                    </div>`;
            };

            const renderMembersTab = () => `
                <div>
                    ${!store.isReadOnly ? `
                    <form data-action="add-member" class="mb-6 bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                        <h3 class="text-sm font-medium text-gray-700 mb-3">Thêm thành viên mới</h3>
                        <div class="flex flex-col gap-4">
                            <div>
                                 <label class="block text-xs text-gray-500 mb-2">Chọn Avatar</label>
                                 <div class="flex gap-2 flex-wrap">
                                     ${MEMBER_ICONS.map(icon => `
                                         <button type="button" data-action="select-member-icon" data-value="${icon}" 
                                             class="p-2 rounded-full border ${store.newMemberIcon === icon ? 'bg-indigo-100 border-indigo-500 text-indigo-600' : 'bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100'} transition-all">
                                             <i data-lucide="${icon}" class="w-5 h-5"></i>
                                         </button>
                                     `).join('')}
                                 </div>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-2">Loại thành viên</label>
                                <div class="flex gap-2 flex-wrap">
                                    <button type="button" data-action="set-child-rate" data-value="" 
                                        class="px-3 py-1.5 rounded-full text-sm font-medium border transition-all ${!store.newChildRate ? 'bg-indigo-100 border-indigo-500 text-indigo-600' : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'}">
                                        Người lớn
                                    </button>
                                    <button type="button" data-action="set-child-rate" data-value="0.5" 
                                        class="px-3 py-1.5 rounded-full text-sm font-medium border transition-all ${store.newChildRate === 0.5 ? 'bg-indigo-100 border-indigo-500 text-indigo-600' : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'}">
                                        Trẻ em (1/2)
                                    </button>
                                    <button type="button" data-action="set-child-rate" data-value="0.25" 
                                        class="px-3 py-1.5 rounded-full text-sm font-medium border transition-all ${store.newChildRate === 0.25 ? 'bg-indigo-100 border-indigo-500 text-indigo-600' : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'}">
                                        Trẻ em (1/4)
                                    </button>
                                </div>

                                <div class="w-10 h-10 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center text-indigo-600">

                                    <button data-action="save-child-rate" data-id="${m.id}" data-value="0.5" class="px-2 py-1 rounded text-xs font-medium border ${m.childRate === 0.5 ? 'bg-amber-100 border-amber-500 text-amber-700' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-100'}">1/2</button>
                                    <button data-action="save-child-rate" data-id="${m.id}" data-value="0.25" class="px-2 py-1 rounded text-xs font-medium border ${m.childRate === 0.25 ? 'bg-amber-100 border-amber-500 text-amber-700' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-100'}">1/4</button>

                                    ${!store.isReadOnly ? `<button data-action="edit-child-rate" data-id="${m.id}" class="text-gray-400 hover:text-indigo-500 p-1 rounded-full hover:bg-indigo-50 transition-colors" title="Sửa loại thành viên"><i data-lucide="edit-2" class="w-4 h-4"></i></button>` : ''}
                                    ${!store.isReadOnly ? `<button data-action="add-advance" data-id="${m.id}" class="text-indigo-600 hover:text-indigo-800 p-2 rounded-md text-sm">Ứng tiền</button>` : ''}
                                    ${!store.isReadOnly ? `<button data-action="remove-member" data-id="${m.id}" class="text-gray-400 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                                `}
                            </div>
                        </div>`;
                        }).join('')}
                    </div>
                </div>`;

            let content = '';
            if (store.activeTab === 'expenses') content = renderExpensesTab();
            else if (store.activeTab === 'balances') content = renderBalancesTab();
            else if (store.activeTab === 'report') content = renderReportTab();
            else if (store.activeTab === 'members') content = renderMembersTab();

            const tabClass = (tab) => `flex-1 py-4 px-4 text-sm font-medium text-center border-b-2 whitespace-nowrap ${store.activeTab === tab ? 'border-indigo-500 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`;

            return `
                <div class="container mx-auto px-4 py-6 max-w-4xl animate-fade-in-down">
                    ${store.isReadOnly ? `<div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4 flex items-center justify-between"><div class="flex items-center gap-2 text-blue-700"><i data-lucide="lock" class="w-4 h-4"></i><span class="text-sm font-medium">View Only Mode.</span></div><button data-action="enable-editing" class="bg-white text-blue-600 border border-blue-200 px-3 py-1 rounded text-xs font-medium hover:bg-blue-50 flex items-center gap-1"><i data-lucide="unlock" class="w-3 h-3"></i> Chỉnh sửa</button></div>` : ''}
                    <div class="mb-6">
                        <button data-action="back-to-list" class="text-gray-500 hover:text-indigo-600 flex items-center mb-4"><i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Quay lại</button>
                        <div class="bg-white rounded-2xl shadow-md overflow-hidden relative group">
                            <div class="h-48 w-full relative">
                                <img src="${trip.coverImage}" class="w-full h-full object-cover" onerror="this.src=FALLBACK_IMAGE" />
                                <div class="absolute inset-0 bg-black/30 flex items-end p-6">
                                    <div class="min-w-0"><h1 class="text-3xl font-bold text-white mb-1 break-words">${escapeHtml(trip.name)}</h1><p class="text-white/90 text-sm flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> ${members.length} thành viên • Tổng chi: <span class="font-bold text-green-300">${formatCurrency(totalSpent)}</span></p></div>
                                </div>
                                <div class="absolute top-4 right-4 flex gap-2">
                                     ${!store.isReadOnly ? `<button data-action="open-edit-trip" title="Sửa chuyến đi" aria-label="Sửa chuyến đi" class="bg-white/20 backdrop-blur-sm p-2 rounded-full text-white hover:bg-white/40 transition-all"><i data-lucide="pencil" class="w-5 h-5"></i></button>` : ''}
                                     ${!store.isReadOnly ? `<button data-action="open-image-selector" data-mode="update" title="Đổi ảnh bìa" aria-label="Đổi ảnh bìa" class="bg-white/20 backdrop-blur-sm p-2 rounded-full text-white hover:bg-white/40 transition-all"><i data-lucide="image" class="w-5 h-5"></i></button>` : ''}
                                     <button data-action="share-trip" title="Chia sẻ" aria-label="Chia sẻ" class="bg-white/20 backdrop-blur-sm p-2 rounded-full text-white hover:bg-white/40 transition-all"><i data-lucide="share-2" class="w-5 h-5"></i></button>
                                </div>
                            </div>
                            <div class="flex border-b border-gray-200 overflow-x-auto">
                                <button data-action="switch-tab" data-tab="expenses" class="${tabClass('expenses')}"><div class="flex items-center justify-center gap-2"><i data-lucide="receipt" class="w-4 h-4"></i> Chi Tiêu</div></button>
                                <button data-action="switch-tab" data-tab="balances" class="${tabClass('balances')}"><div class="flex items-center justify-center gap-2"><i data-lucide="wallet" class="w-4 h-4"></i> Công Nợ</div></button>
                                <button data-action="switch-tab" data-tab="report" class="${tabClass('report')}"><div class="flex items-center justify-center gap-2"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Tổng kết</div></button>
                                <button data-action="switch-tab" data-tab="members" class="${tabClass('members')}"><div class="flex items-center justify-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> Thành Viên</div></button>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 min-h-[400px]">${content}</div>
                </div>`;
        };

        const renderExpenseModal = () => {
            if (!store.expenseModalOpen) return '';
            const trip = store.trips.find(t => t.id === store.activeTripId);
            if (!trip) return '';
            const members = trip.members || [];
            const involvedIds = store.expenseForm.involvedIds.length > 0 ? store.expenseForm.involvedIds : members.map(m => m.id);
            const currentIcon = store.expenseForm.icon || 'receipt';

            return `
                <div class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" data-action="close-modal"></div>
                        <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
                        <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                                <div class="flex justify-between items-center mb-4 border-b pb-2"><h3 id="modal-title" class="text-lg leading-6 font-medium text-gray-900">${store.editingExpenseId ? 'Sửa Khoản Chi' : 'Thêm Khoản Chi Mới'}</h3><button data-action="close-modal" aria-label="Đóng" class="text-gray-400 hover:text-gray-500"><i data-lucide="x" class="w-6 h-6"></i></button></div>
                                <div class="space-y-4">
                                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label><input type="text" id="ex-desc" value="${escapeHtml(store.expenseForm.desc)}" class="w-full rounded-md border border-gray-300 p-2" placeholder="VD: Vé tham quan"></div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Số tiền (VNĐ)</label>
                                        <input type="text" inputmode="numeric" id="ex-amount" value="${escapeHtml(displayAmount(store.expenseForm.amount))}" class="w-full rounded-md border border-gray-300 p-2" placeholder="VD: 100k hoặc 100000" />
                                        <p id="ex-amount-hint" class="hidden text-xs text-indigo-600 font-medium mt-1"></p>
                                        <div class="flex flex-wrap gap-1.5 mt-2">
                                            ${[50000, 100000, 200000, 500000, 1000000].map(v => `<button type="button" data-action="quick-amount" data-value="${v}" class="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600">${v >= 1000000 ? (v / 1000000) + 'tr' : (v / 1000) + 'k'}</button>`).join('')}
                                        </div>
                                    </div>
                                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Người trả</label><select id="ex-payer" class="w-full rounded-md border border-gray-300 p-2"><option value="">-- Chọn người trả --</option>${members.map(m => `<option value="${m.id}" ${m.id === store.expenseForm.payerId ? 'selected' : ''}>${m.name}</option>`).join('')}</select></div>
                                    
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Loại chi tiêu</label>
                                        <div class="flex flex-wrap gap-2">
                                            ${CATEGORY_ICONS.map(c => `
                                                <button type="button" data-action="select-icon" data-value="${c.id}" 
                                                    class="p-2 rounded-lg border flex items-center gap-1 transition-colors ${currentIcon === c.id ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}"
                                                    title="${c.label}">
                                                    <i data-lucide="${c.icon}" class="w-5 h-5"></i>
                                                </button>
                                            `).join('')}
                                        </div>
                                    </div>

                                    <div><div class="flex justify-between items-center mb-2"><label class="block text-sm font-medium text-gray-700">Thành viên tham gia</label><button data-action="toggle-select-all" class="text-xs text-indigo-600 font-medium hover:underline">${involvedIds.length === members.length ? 'Bỏ chọn tất cả' : 'Chọn tất cả'}</button></div><div class="flex flex-wrap gap-2 max-h-32 overflow-y-auto p-1">${members.map(m => { const isSelected = involvedIds.includes(m.id); return `<button type="button" data-action="toggle-involved" data-id="${m.id}" class="px-3 py-1.5 rounded-full text-sm font-medium border flex items-center gap-1 ${isSelected ? 'bg-indigo-100 text-indigo-700 border-indigo-200' : 'bg-white text-gray-600 border-gray-200'}">${isSelected ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''} <span class="flex items-center gap-1"><i data-lucide="${m.icon || 'user'}" class="w-3 h-3"></i> ${m.name}</span>${m.childRate ? `<span class="text-[10px] text-amber-500 ml-0.5">(1/${m.childRate === 0.5 ? '2' : '4'})</span>` : ''}</button>`; }).join('')}</div></div>
                                </div>
                            </div>
                            <p id="ex-form-error" class="hidden px-4 sm:px-6 pt-3 text-sm text-red-600 font-medium"></p>
                            <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse"><button type="button" data-action="save-expense" class="box-btn w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">Lưu</button><button type="button" data-action="close-modal" class="box-btn-ghost mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">Hủy</button></div>
                        </div>
                    </div>
                </div>`;
        };

        const renderImageSelector = () => {
            if (!store.imageSelectionModalOpen) return '';
            return `
                <div class="fixed inset-0 z-[60] overflow-y-auto" role="dialog" aria-modal="true">
                    <div class="flex items-center justify-center min-h-screen px-4">
                        <div class="fixed inset-0 bg-gray-500 bg-opacity-75" data-action="close-image-selector"></div>
                        <div class="relative bg-white rounded-lg shadow-xl max-w-2xl w-full p-6">
                            <h3 class="text-lg font-bold text-gray-900 mb-4">Chọn Ảnh Bìa</h3>
                            
                            <div class="mb-6">
                                <h4 class="text-sm font-medium text-gray-700 mb-2">Thư viện có sẵn</h4>
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                                    ${GALLERIES.map(url => `
                                        <div class="relative aspect-video rounded-lg overflow-hidden cursor-pointer group" data-action="select-gallery-image" data-url="${url}">
                                            <img src="${url}" class="w-full h-full object-cover group-hover:scale-110 transition-transform" onerror="this.src=FALLBACK_IMAGE" />
                                            ${store.selectedImage === url ? '<div class="absolute inset-0 bg-indigo-600/40 flex items-center justify-center"><i data-lucide="check" class="text-white w-8 h-8"></i></div>' : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="mb-6">
                                <h4 class="text-sm font-medium text-gray-700 mb-2">Hoặc tải ảnh lên</h4>
                                <input type="file" id="custom-image-upload" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"/>
                            </div>

                            <div class="flex justify-end gap-2">
                                <button data-action="close-image-selector" class="box-btn-ghost px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50">Hủy</button>
                                <button data-action="confirm-image-selection" class="box-btn px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Chọn ảnh này</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderEditTripModal = () => {
            if (!store.editTripModalOpen) return '';
            const trip = store.trips.find(t => t.id === store.activeTripId);
            if (!trip) return '';
            const startDate = store.editTripForm.startDate ? String(store.editTripForm.startDate).slice(0, 10) : '';
            return `
                <div class="fixed inset-0 z-[70] overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="edit-trip-title">
                    <div class="flex items-center justify-center min-h-screen px-4">
                        <div class="fixed inset-0 bg-gray-500 bg-opacity-75" data-action="close-edit-trip"></div>
                        <div class="relative bg-white rounded-lg shadow-xl max-w-md w-full p-6 animate-fade-in-up">
                            <div class="flex justify-between items-center mb-4 border-b pb-2">
                                <h3 id="edit-trip-title" class="text-lg font-bold text-gray-900">Sửa chuyến đi</h3>
                                <button data-action="close-edit-trip" aria-label="Đóng" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-6 h-6"></i></button>
                            </div>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên chuyến đi</label>
                                    <input type="text" id="edit-trip-name" value="${escapeHtml(store.editTripForm.name)}" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-indigo-500 outline-none" />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Ngày bắt đầu</label>
                                    <input type="date" id="edit-trip-date" value="${startDate}" class="w-full rounded-md border border-gray-300 p-2 focus:ring-2 focus:ring-indigo-500 outline-none" />
                                </div>
                                <p id="edit-trip-error" class="hidden text-sm text-red-600 font-medium"></p>
                            </div>
                            <div class="flex justify-end gap-2 mt-6">
                                <button data-action="close-edit-trip" class="box-btn-ghost px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">Hủy</button>
                                <button data-action="save-edit-trip" class="box-btn px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 font-medium">Lưu</button>
                            </div>
                        </div>
                    </div>
                </div>`;
        };

        const render = () => {
            const active = document.activeElement;
            const activeId = active ? active.id : null;
            const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
            const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

            if (store.activeTripId) app.innerHTML = renderTripDetail();
            else app.innerHTML = renderTripList();

            let modals = renderExpenseModal();
            modals += renderImageSelector();
            modals += renderEditTripModal();
            modalContainer.innerHTML = modals;

            if (window.lucide) window.lucide.createIcons();
            syncScrollLock();

            // Restore focus/caret to the element that had focus before re-render
            if (activeId) {
                const el = document.getElementById(activeId);
                if (el && typeof el.focus === 'function') {
                    try {
                        el.focus();
                        if (selStart !== null && typeof el.setSelectionRange === 'function') {
                            el.setSelectionRange(selStart, selEnd);
                        }
                    } catch (err) { /* ignore */ }
                }
            }

            if (store.expenseModalOpen) updateAmountHint(store.expenseForm.amount);
        };

        // --- THEME ---
        const THEME_KEY = 'easytrip-theme';
        const applyTheme = (t) => {
            document.body.setAttribute('data-theme', t || 'forest');
            try { localStorage.setItem(THEME_KEY, t || 'forest'); } catch (err) { /* ignore */ }
            const menu = document.getElementById('theme-menu');
            if (menu) menu.classList.add('hidden');
        };
        try {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved) document.body.setAttribute('data-theme', saved);
        } catch (err) { /* ignore */ }

        document.addEventListener('click', (e) => {
            const t = e.target.closest('[data-action]');
            const menu = document.getElementById('theme-menu');
            const sw = document.getElementById('theme-switcher');
            if (t && t.dataset.action === 'toggle-theme-menu') { menu?.classList.toggle('hidden'); return; }
            if (t && t.dataset.action === 'set-theme') { applyTheme(t.dataset.theme); return; }
            if (sw && !sw.contains(e.target)) menu?.classList.add('hidden');
        });

        // --- EVENT HANDLERS ---
        document.addEventListener('click', async (e) => {
            const target = e.target.closest('[data-action]');
            if (e.target.tagName === 'A' || e.target.closest('a')) e.preventDefault();
            if (!target) return;
            if (target.tagName === 'BUTTON' && target.type !== 'submit') e.preventDefault();

            const action = target.dataset.action;
            const id = target.dataset.id;

            if (action === 'select-trip') { store.activeTripId = id; store.isReadOnly = false; store.activeTab = 'expenses'; store.expenseSearchText = ''; store.reportSearchText = ''; render(); }

            if (action === 'back-to-list') {
                store.activeTripId = null;
                store.isReadOnly = false;
                store.expenseSearchText = '';
                store.reportSearchText = '';
                if (window.location.protocol !== 'file:') {
                    try {
                        window.history.pushState("", document.title, window.location.pathname + window.location.search);
                    } catch (err) {
                        console.warn("Could not pushState:", err);
                    }
                }
                render();
            }

            if (action === 'switch-tab') { store.activeTab = target.dataset.tab; render(); }
            if (action === 'toggle-create-form') { store.isCreating = !store.isCreating; store.selectedImage = ''; render(); if (store.isCreating) setTimeout(() => document.getElementById('new-trip-input')?.focus(), 50); }
            if (action === 'cancel-create') { store.isCreating = false; render(); }
            if (action === 'delete-trip') {
                e.stopPropagation(); // Prevents opening the trip
                if (await showConfirm("Bạn có chắc muốn xóa chuyến đi này? Toàn bộ chi tiêu và thành viên sẽ bị xóa.", "Xóa chuyến đi")) {
                    await deleteTripFromDB(id);
                }
            }
            if (action === 'share-trip') {
                const trip = store.trips.find(t => t.id === store.activeTripId);
                const baseUrl = window.location.href.split('#')[0];
                const shareUrl = `${baseUrl}#trip=${trip.id}`;
                try { await navigator.clipboard.writeText(shareUrl); } catch (err) { console.warn(err); }
                showToast('Đã sao chép link chia sẻ!', 'success');
            } if (action === 'enable-editing') { store.isReadOnly = false; render(); }

            if (action === 'remove-member') {
                if (!(await showConfirm("Xóa thành viên này? Các khoản chi liên quan sẽ được tính lại.", "Xóa thành viên"))) return;
                const trip = store.trips.find(t => t.id === store.activeTripId);
                const remainingMembers = trip.members.filter(m => m.id !== id);
                const updatedExpenses = trip.expenses.map(e => {
                    const newInvolved = e.involvedMemberIds ? e.involvedMemberIds.filter(mid => mid !== id) : [];
                    let newPayerId = e.payerId;
                    if (e.payerId === id) { newPayerId = remainingMembers.length > 0 ? remainingMembers[0].id : ''; }
                    return { ...e, payerId: newPayerId, involvedMemberIds: newInvolved };
                });
                const ok = await updateTripInDB({ ...trip, members: remainingMembers, expenses: updatedExpenses });
                if (ok) showToast('Đã xóa thành viên', 'success');
            }

            if (action === 'add-advance') {
                const memberId = target.dataset.id;
                const trip = store.trips.find(t => t.id === store.activeTripId);
                if (!trip) return;
                const memberName = trip.members.find(m => m.id === memberId)?.name || 'thành viên';
                const raw = await showPrompt('Nhập số tiền ứng (VNĐ) cho ' + memberName + ':', '', 'VD: 500k hoặc 500000');
                if (raw === null) return;
                const amount = parseAmount(raw);
                if (amount <= 0) { showToast('Vui lòng nhập số tiền hợp lệ.', 'error'); return; }
                const advance = { id: generateId(), memberId, amount, date: new Date().toISOString(), note: '' };
                const updatedAdv = [...(trip.advances || [])];
                updatedAdv.unshift(advance);
                const ok = await updateTripInDB({ ...trip, advances: updatedAdv });
                if (ok) showToast('Đã thêm khoản ứng tiền', 'success');
            }

            if (action === 'select-member-icon') {
                store.newMemberIcon = target.dataset.value;
                render();
            }

            if (action === 'set-child-rate') {
                const val = target.dataset.value;
                store.newChildRate = val === '' ? null : parseFloat(val);
                render();
            }

            if (action === 'edit-child-rate') {
                store.editingChildMemberId = target.dataset.id;
                render();
            }

            if (action === 'cancel-edit-child') {
                store.editingChildMemberId = null;
                render();
            }

            if (action === 'save-child-rate') {
                const memberId = target.dataset.id;
                const val = target.dataset.value;
                const newRate = val === '' ? null : parseFloat(val);
                const trip = store.trips.find(t => t.id === store.activeTripId);
                const updatedMembers = trip.members.map(m => m.id === memberId ? { ...m, childRate: newRate } : m);
                store.editingChildMemberId = null;
                const ok = await updateTripInDB({ ...trip, members: updatedMembers });
                if (ok) showToast('Đã cập nhật loại thành viên', 'success');
            }

            if (action === 'open-expense-modal') { store.expenseModalOpen = true; store.editingExpenseId = null; const trip = store.trips.find(t => t.id === store.activeTripId); store.expenseForm = { desc: '', amount: '', payerId: '', involvedIds: trip.members.map(m => m.id), icon: 'receipt' }; render(); setTimeout(() => document.getElementById('ex-desc')?.focus(), 50); }
            if (action === 'close-modal') { store.expenseModalOpen = false; render(); }
            if (action === 'edit-expense') {
                const trip = store.trips.find(t => t.id === store.activeTripId);
                const expense = trip.expenses.find(e => e.id === id);
                store.expenseModalOpen = true;
                store.editingExpenseId = id;
                store.expenseForm = {
                    desc: expense.description,
                    amount: expense.amount,
                    payerId: expense.payerId,
                    involvedIds: expense.involvedMemberIds || trip.members.map(m => m.id),
                    icon: expense.categoryIcon || 'receipt'
                };
                render();
            }
            if (action === 'delete-expense') { if (await showConfirm("Xóa khoản chi này?", "Xóa khoản chi")) { const trip = store.trips.find(t => t.id === store.activeTripId); const updatedExpenses = trip.expenses.filter(e => e.id !== id); const ok = await updateTripInDB({ ...trip, expenses: updatedExpenses }); if (ok) showToast('Đã xóa khoản chi', 'success'); } }

            if (action === 'toggle-involved') { const id = target.dataset.id; if (store.expenseForm.involvedIds.includes(id)) store.expenseForm.involvedIds = store.expenseForm.involvedIds.filter(i => i !== id); else store.expenseForm.involvedIds.push(id); render(); }
            if (action === 'toggle-select-all') { const trip = store.trips.find(t => t.id === store.activeTripId); store.expenseForm.involvedIds = store.expenseForm.involvedIds.length === trip.members.length ? [] : trip.members.map(m => m.id); render(); }

            if (action === 'select-icon') {
                store.expenseForm.icon = target.dataset.value;
                render();
            }

            if (action === 'quick-amount') {
                store.expenseForm.amount = parseInt(target.dataset.value, 10) || 0;
                render();
            }

            if (action === 'open-edit-trip') {
                const trip = store.trips.find(t => t.id === store.activeTripId);
                if (!trip) return;
                store.editTripModalOpen = true;
                store.editTripForm = { name: trip.name || '', startDate: trip.startDate || new Date().toISOString() };
                render();
                setTimeout(() => document.getElementById('edit-trip-name')?.focus(), 50);
            }
            if (action === 'close-edit-trip') { store.editTripModalOpen = false; render(); }
            if (action === 'save-edit-trip') {
                const nameEl = document.getElementById('edit-trip-name');
                const dateEl = document.getElementById('edit-trip-date');
                const errEl = document.getElementById('edit-trip-error');
                const name = nameEl ? nameEl.value.trim() : '';
                const date = dateEl ? dateEl.value : '';
                if (!name) {
                    if (errEl) { errEl.textContent = 'Vui lòng nhập tên chuyến đi.'; errEl.classList.remove('hidden'); }
                    if (nameEl) nameEl.focus();
                    return;
                }
                if (errEl) errEl.classList.add('hidden');
                setBtnLoading(target, true, 'Đang lưu...');
                const trip = store.trips.find(t => t.id === store.activeTripId);
                const updated = { ...trip, name, startDate: date ? new Date(date + 'T00:00:00').toISOString() : trip.startDate };
                const ok = await updateTripInDB(updated);
                if (ok) {
                    store.editTripModalOpen = false;
                    render();
                    showToast('Đã lưu chuyến đi', 'success');
                } else {
                    setBtnLoading(target, false);
                }
            }

            if (action === 'save-expense') {
                const descEl = document.getElementById('ex-desc');
                const amountEl = document.getElementById('ex-amount');
                const payerEl = document.getElementById('ex-payer');
                const errEl = document.getElementById('ex-form-error');
                const desc = descEl ? descEl.value.trim() : '';
                const amount = amountEl ? parseAmount(amountEl.value) : 0;
                const payerId = payerEl ? payerEl.value : '';

                const problems = [];
                if (!desc) problems.push('mô tả');
                if (amount <= 0) problems.push('số tiền hợp lệ');
                if (!payerId) problems.push('người trả');
                if (store.expenseForm.involvedIds.length === 0) problems.push('ít nhất 1 thành viên tham gia');

                if (errEl) {
                    if (problems.length) {
                        errEl.textContent = 'Vui lòng bổ sung: ' + problems.join(', ') + '.';
                        errEl.classList.remove('hidden');
                    } else {
                        errEl.textContent = '';
                        errEl.classList.add('hidden');
                    }
                }
                if (problems.length) return;

                setBtnLoading(target, true, 'Đang lưu...');

                const trip = store.trips.find(t => t.id === store.activeTripId);
                // Special handling: if description starts with 'Ứng tiền', create one expense per involved member
                let updatedExpenses = [...trip.expenses];
                if (desc.startsWith('Ứng tiền')) {
                    const perMember = store.expenseForm.involvedIds.map(mid => {
                        return {
                            id: generateId(),
                            description: `Ứng tiền — ${trip.members.find(m=>m.id===mid)?.name || ''}`,
                            amount: amount,
                            payerId: mid,
                            date: new Date().toISOString(),
                            involvedMemberIds: store.expenseForm.involvedIds,
                            categoryIcon: store.expenseForm.icon
                        };
                    });
                    updatedExpenses = [...perMember, ...updatedExpenses];
                } else {
                    const expenseData = {
                        id: store.editingExpenseId || generateId(),
                        description: desc,
                        amount,
                        payerId,
                        date: new Date().toISOString(),
                        involvedMemberIds: store.expenseForm.involvedIds,
                        categoryIcon: store.expenseForm.icon
                    };

                    if (store.editingExpenseId) updatedExpenses = updatedExpenses.map(e => e.id === store.editingExpenseId ? expenseData : e);
                    else updatedExpenses.unshift(expenseData);
                }

                const wasEditing = !!store.editingExpenseId;
                const ok = await updateTripInDB({ ...trip, expenses: updatedExpenses });
                if (ok) {
                    store.expenseModalOpen = false;
                    store.editingExpenseId = null;
                    render();
                    showToast(wasEditing ? 'Đã cập nhật khoản chi' : 'Đã thêm khoản chi', 'success');
                } else {
                    setBtnLoading(target, false);
                }
            }

            if (action === 'ai-quick-add') {
                const text = document.getElementById('quick-add-input').value.trim();
                if (!text) return;
                store.isAnalyzing = true; render();
                const trip = store.trips.find(t => t.id === store.activeTripId);
                const result = await parseExpenseWithAI(text, trip.members.map(m => m.name));
                store.isAnalyzing = false;
                if (result) {
                    store.expenseModalOpen = true; store.editingExpenseId = null;
                    const payer = trip.members.find(m => m.name.toLowerCase() === result.payerName?.toLowerCase());
                    store.expenseForm = {
                        desc: result.description,
                        amount: result.amount,
                        payerId: payer?.id || '',
                        involvedIds: trip.members.map(m => m.id),
                        icon: result.categoryIcon || 'receipt'
                    };
                }
                render();
            }

            if (action === 'advance-prompt') {
                const trip = store.trips.find(t => t.id === store.activeTripId);
                if (!trip) return;
                // Open expense modal prefilled for an advance. User can pick payer in modal.
                store.expenseModalOpen = true;
                store.editingExpenseId = null;
                store.expenseForm = {
                    desc: 'Ứng tiền — ',
                    amount: '',
                    payerId: trip.members[0]?.id || '',
                    involvedIds: trip.members.map(m => m.id),
                    icon: 'receipt'
                };
                render();
            }

            // --- IMAGE SELECTOR ACTIONS ---
            if (action === 'open-image-selector') {
                store.imageSelectionModalOpen = true;
                store.updateCoverMode = target.dataset.mode === 'update'; // Track if updating existing or new
                // If creating new trip, preview current selected image. If updating, maybe preselect nothing or current?
                // Let's keep it simple: just open selector.
                render();
            }
            if (action === 'close-image-selector') {
                store.imageSelectionModalOpen = false;
                render();
            }
            if (action === 'select-gallery-image') {
                store.selectedImage = target.dataset.url;
                render();
            }
            if (action === 'confirm-image-selection') {
                const img = store.customImageFile || store.selectedImage;
                if (!img) { showToast('Vui lòng chọn ảnh.', 'error'); return; }
                setBtnLoading(target, true, 'Đang lưu...');
                if (store.updateCoverMode && store.activeTripId) {
                    const trip = store.trips.find(t => t.id === store.activeTripId);
                    const ok = await updateTripInDB({ ...trip, coverImage: img });
                    if (!ok) { setBtnLoading(target, false); return; }
                    showToast('Đã cập nhật ảnh bìa', 'success');
                }
                store.imageSelectionModalOpen = false;
                render();
            }
        });

        document.addEventListener('change', async (e) => {
            if (e.target.id === 'custom-image-upload') {
                const file = e.target.files[0];
                if (file) {
                    try {
                        const compressed = await compressImage(file);
                        if (compressed.length > 950000) {
                            showToast('Ảnh quá lớn sau khi nén, hãy chọn ảnh khác.', 'error');
                            return;
                        }
                        store.selectedImage = compressed;
                        store.customImageFile = compressed; // Keep track for confirm
                        render();
                        showToast('Đã tải ảnh bìa', 'success');
                    } catch (err) {
                        console.error(err);
                        showToast("Lỗi tải ảnh.", 'error');
                    }
                }
            }
        });

        document.addEventListener('submit', async (e) => {
            e.preventDefault();
            const action = e.target.dataset.action;
            if (action === 'submit-create-trip') {
                const input = document.getElementById('new-trip-input');
                const errEl = document.getElementById('new-trip-error');
                const name = input ? input.value.trim() : '';
                if (!name) {
                    if (errEl) { errEl.textContent = 'Vui lòng nhập tên chuyến đi.'; errEl.classList.remove('hidden'); }
                    if (input) input.focus();
                    return;
                }
                if (errEl) errEl.classList.add('hidden');
                const btn = e.target.querySelector('button[type="submit"]');
                setBtnLoading(btn, true, 'Đang tạo...');
                const ok = await createTripInDB(name, store.selectedImage);
                if (ok) showToast('Đã tạo chuyến đi', 'success');
                else setBtnLoading(btn, false);
            }
            if (action === 'add-member') {
                const input = document.getElementById('new-member-input');
                const errEl = document.getElementById('new-member-error');
                const name = input.value.trim();
                if (!name) {
                    if (errEl) { errEl.textContent = 'Vui lòng nhập tên thành viên.'; errEl.classList.remove('hidden'); }
                    input.focus();
                    return;
                }
                if (errEl) errEl.classList.add('hidden');
                const btn = e.target.querySelector('button[type="submit"]');
                setBtnLoading(btn, true, 'Đang thêm...');
                const trip = store.trips.find(t => t.id === store.activeTripId);
                store.newMemberName = ''; input.value = '';
                const newMember = { id: generateId(), name, icon: store.newMemberIcon || 'user', childRate: store.newChildRate };
                // Reset icon and child rate after adding
                store.newMemberIcon = 'user';
                store.newChildRate = null;
                const ok = await updateTripInDB({ ...trip, members: [...trip.members, newMember] });
                if (ok) showToast('Đã thêm thành viên', 'success');
                else setBtnLoading(btn, false);
            }
        });

        document.addEventListener('input', (e) => {
            if (e.target.id === 'new-trip-input') store.newTripName = e.target.value;
            if (e.target.id === 'new-member-input') store.newMemberName = e.target.value;
            if (e.target.id === 'quick-add-input') store.quickAddText = e.target.value;
            if (e.target.id === 'report-search') { store.reportSearchText = e.target.value; render(); }
            if (e.target.id === 'expense-search') { store.expenseSearchText = e.target.value; render(); }

            if (e.target.id === 'ex-desc') store.expenseForm.desc = e.target.value;
            if (e.target.id === 'ex-amount') {
                store.expenseForm.amount = e.target.value;
                updateAmountHint(e.target.value);
            }
            if (e.target.id === 'ex-payer') store.expenseForm.payerId = e.target.value;
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (store.expenseModalOpen) { store.expenseModalOpen = false; render(); }
                else if (store.imageSelectionModalOpen) { store.imageSelectionModalOpen = false; render(); }
                else if (store.editTripModalOpen) { store.editTripModalOpen = false; render(); }
            }
            if (e.key === 'Tab') {
                const container = document.querySelector('#modal-container [role="dialog"]') || document.getElementById('confirm-overlay') || document.getElementById('prompt-overlay');
                if (container) {
                    const focusables = Array.from(container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(el => !el.disabled && el.offsetParent !== null);
                    if (focusables.length) {
                        const first = focusables[0];
                        const last = focusables[focusables.length - 1];
                        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
                        else if (!container.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
                    }
                }
            }
            if (e.key === 'Enter' && e.target.id === 'quick-add-input') document.querySelector('[data-action="ai-quick-add"]')?.click();
        });

        initFirebaseListener();
    </script>
</body>

</html>
